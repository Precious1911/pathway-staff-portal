{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<section class="card">
  <h2>Change Password</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  {% if message %}<p>{{ message }}</p>{% endif %}
  <form method="post" action="/account/password">
    <label>Current password<input name="current_password" type="password" required autocomplete="current-password"></label>
    <label>New password (at least {{ min_length }} characters)<input name="new_password" type="password" required minlength="{{ min_length }}" autocomplete="new-password"></label>
    <label>Confirm new password<input name="confirm_password" type="password" required minlength="{{ min_length }}" autocomplete="new-password"></label>
    <button type="submit">Update password</button>
  </form>
</section>
{% endblock %}
